[package]
name = "litelaunch-plugin"
version = "0.1.0"
edition = "2024"
description = "Plugin SDK for LiteLaunch: the DLL interface, result types and shared helpers"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
